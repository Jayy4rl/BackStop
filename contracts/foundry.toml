[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
# paris: no PUSH0 / MCOPY / transient storage, so the same source also targets
# Arc and the TVM (TRON) without opcode differences.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.invariant]
runs = 512
depth = 128
